name: Package PrivateFlix

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifest version
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          test -n "$VERSION"
          test "$VERSION" != "null"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build extension ZIP
        shell: bash
        run: |
          mkdir -p dist/privateflix
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dist' ./ dist/privateflix/
          cd dist
          zip -qr "PrivateFlix-v${{ steps.version.outputs.value }}.zip" privateflix

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateFlix-v${{ steps.version.outputs.value }}
          path: dist/PrivateFlix-v${{ steps.version.outputs.value }}.zip

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" "dist/PrivateFlix-v${{ steps.version.outputs.value }}.zip" --generate-notes --title "PrivateFlix $GITHUB_REF_NAME"
